defaults:
  timeoutMs: 30000
  concurrency: 4

mentions:
  mode: off
  # To render profile links instead:
  # mode: template
  # textTemplate: "{name}"
  # urlTemplate: "https://people.example.com/{username}"
  # aliases: {}
  #
  # To resolve verified native destination users with the same fallback:
  # mode: auto
  # textTemplate: "{name}"
  # urlTemplate: "https://people.example.com/{username}"
  # aliases:
  #   "username:source-login":
  #     username: destination-login
  #     accountId: destination-cloud-account-id

connections:
  yandex:
    type: yandex-wiki
    apiUrl: https://api.wiki.yandex.net/v1
    webUrl: https://wiki.example.com
    authType: oauth
    token: ""
    organization:
      type: yandex360
      id: example-organization-id
    limits:
      readConcurrency: 4
      writeConcurrency: 2
      downloadConcurrency: 2
      uploadConcurrency: 2
      requestsPerSecond: 8
      burst: 8

  confluence:
    type: confluence
    deployment: data-center
    baseUrl: https://confluence.example.com/confluence
    authType: pat
    token: ""
    limits:
      readConcurrency: 4
      writeConcurrency: 2
      downloadConcurrency: 2
      uploadConcurrency: 2
      requestsPerSecond: 8
      burst: 10

