defaults:
  timeoutMs: 30000
  concurrency: 4

mentions:
  mode: off
  # For explicit decisions instead: mode: mapping, mappingFile: ./mentions/decisions.json

hashtags:
  mode: off
  # For explicit decisions instead: mode: mapping, mappingFile: ./hashtags/decisions.json

connections:
  yandex:
    type: yandex-wiki
    apiUrl: https://api.wiki.yandex.net/v1
    webUrl: https://wiki.example.com
    authType: oauth
    token: ""
    organization:
      type: yandex360
      id: example-organization-id
    limits:
      readConcurrency: 4
      writeConcurrency: 2
      downloadConcurrency: 2
      uploadConcurrency: 2
      requestsPerSecond: 8
      burst: 8

  confluence:
    type: confluence
    deployment: data-center
    baseUrl: https://confluence.example.com/confluence
    authType: pat
    token: ""
    limits:
      readConcurrency: 4
      writeConcurrency: 2
      downloadConcurrency: 2
      uploadConcurrency: 2
      requestsPerSecond: 8
      burst: 10

