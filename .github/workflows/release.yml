name: CI and Release

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z release to verify or repair
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commitlint:
    name: Conventional commits
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Validate pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          base="$BEFORE_SHA"
          if [[ "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 "$HEAD_SHA")"
          fi
          npx commitlint --from "$base" --to "$HEAD_SHA" --verbose

  checks:
    name: Node ${{ matrix.node }} quality gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, current]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run project checks
        run: npm run check

  release-please:
    name: Propose or create release
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [commitlint, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: master
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    name: Publish npm and GitHub artifacts
    needs: [checks, release-please]
    if: >-
      always() && needs.checks.result == 'success' &&
      (needs.release-please.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      tag_name: ${{ steps.context.outputs.tag }}
      version: ${{ steps.context.outputs.version }}
    steps:
      - name: Resolve release context
        id: context
        env:
          AUTOMATIC_TAG: ${{ needs.release-please.outputs.tag_name }}
          MANUAL_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          tag="${AUTOMATIC_TAG:-$MANUAL_TAG}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Check out released revision
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.context.outputs.tag }}
          fetch-depth: 0
      - name: Load current release tools for manual recovery
        if: github.event_name == 'workflow_dispatch'
        id: recovery-tools
        shell: bash
        run: |
          validator_dir="$RUNNER_TEMP/release-validator"
          mkdir -p "$validator_dir"
          git fetch --no-tags origin master
          validator_commit="$(git rev-parse FETCH_HEAD)"
          git show "${validator_commit}:scripts/release-validation.ts" > "$validator_dir/release-validation.ts"
          git show "${validator_commit}:scripts/validate-release-tag.ts" > "$validator_dir/validate-release-tag.ts"
          git show "${validator_commit}:scripts/package-validation.ts" > "$validator_dir/package-validation.ts"
          echo "entry=$validator_dir/validate-release-tag.ts" >> "$GITHUB_OUTPUT"
          echo "package_verifier=$validator_dir/package-validation.ts" >> "$GITHUB_OUTPUT"
          echo "commit=$validator_commit" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js and npm trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install current npm
        run: npm install --global npm@12.2.0
      - name: Install and validate release
        env:
          RELEASE_TAG: ${{ steps.context.outputs.tag }}
          RECOVERY_VALIDATOR: ${{ steps.recovery-tools.outputs.entry }}
          RECOVERY_PACKAGE_VERIFIER: ${{ steps.recovery-tools.outputs.package_verifier }}
        run: |
          npm ci
          if [[ -n "$RECOVERY_PACKAGE_VERIFIER" ]]; then
            cp "$RECOVERY_PACKAGE_VERIFIER" scripts/package-validation.ts
          fi
          if [[ -n "$RECOVERY_VALIDATOR" ]]; then
            node --import tsx "$RECOVERY_VALIDATOR" "$RELEASE_TAG"
          else
            npm run release:validate -- "$RELEASE_TAG"
          fi
          npm run check
          if [[ -n "$RECOVERY_PACKAGE_VERIFIER" ]]; then
            git restore --source=HEAD -- scripts/package-validation.ts
            git diff --exit-code -- scripts/package-validation.ts
          fi
      - name: Pack exact publication artifact
        id: pack
        env:
          RELEASE_VERSION: ${{ steps.context.outputs.version }}
        shell: bash
        run: |
          release_dir="$RUNNER_TEMP/ywtc-release"
          mkdir -p "$release_dir"
          npm pack --ignore-scripts --json --pack-destination "$release_dir" > "$release_dir/pack.json"
          archive_name="$(node -e "const p=require(process.argv[1]); const values=Array.isArray(p)?p:Object.values(p); const result=values.length===1?values[0]:undefined; if(!result||typeof result.filename!=='string'||!result.filename) throw new Error('npm pack returned no single valid artifact'); process.stdout.write(result.filename)" "$release_dir/pack.json")"
          archive="$release_dir/$archive_name"
          shasum -a 256 "$archive" > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
      - name: Publish with OIDC provenance when absent
        env:
          RELEASE_VERSION: ${{ steps.context.outputs.version }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
        shell: bash
        run: |
          if npm view "@iwonz/ywtc@$RELEASE_VERSION" version >/dev/null 2>&1; then
            echo "@iwonz/ywtc@$RELEASE_VERSION already exists; verifying idempotent rerun."
            exit 0
          fi
          npm publish "$ARCHIVE" --access public --provenance
      - name: Attach verified artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.context.outputs.tag }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
        run: gh release upload "$RELEASE_TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
      - name: Add verified installation notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.context.outputs.tag }}
        shell: bash
        run: |
          body="$RUNNER_TEMP/release-body.md"
          gh release view "$RELEASE_TAG" --json body --jq .body > "$body"
          if ! grep -q '<!-- ywtc-installation -->' "$body"; then
            {
              printf '\n<!-- ywtc-installation -->\n## Installation\n\n'
              printf '```bash\nnpm install -g @iwonz/ywtc@latest\nnpx @iwonz/ywtc@latest --version\nbrew tap iwonz/ywtc https://github.com/iwonz/ywtc.git\nbrew install ywtc\n```\n'
            } >> "$body"
          fi
          gh release edit "$RELEASE_TAG" --notes-file "$body"

  homebrew:
    name: Verify and publish Homebrew formula
    needs: publish-npm
    if: always() && needs.publish-npm.result == 'success'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Check out current master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - name: Synchronize master
        run: |
          git fetch origin master
          git pull --ff-only origin master
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Generate formula from npm registry archive
        env:
          RELEASE_VERSION: ${{ needs.publish-npm.outputs.version }}
        shell: bash
        run: |
          npm ci
          mkdir -p Formula
          registry_url="$(npm view "@iwonz/ywtc@$RELEASE_VERSION" dist.tarball)"
          archive="$RUNNER_TEMP/ywtc-$RELEASE_VERSION.tgz"
          curl --fail --silent --show-error --location "$registry_url" --output "$archive"
          sha256="$(shasum -a 256 "$archive" | awk '{print $1}')"
          node --import tsx scripts/homebrew-formula.ts "$RELEASE_VERSION" "$registry_url" "$sha256" Formula/ywtc.rb
      - name: Verify formula
        shell: bash
        run: |
          brew style Formula/ywtc.rb
          tap_name="iwonz/ywtc-ci"
          brew tap-new --no-git "$tap_name"
          tap_dir="$(brew --repository "$tap_name")"
          cp Formula/ywtc.rb "$tap_dir/Formula/ywtc.rb"
          brew audit --strict "$tap_name/ywtc"
          brew install --formula "$tap_name/ywtc"
          brew test "$tap_name/ywtc"
          ywtc --version
      - name: Commit formula to master
        env:
          RELEASE_VERSION: ${{ needs.publish-npm.outputs.version }}
        shell: bash
        run: |
          git fetch origin master
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]]; then
            echo "origin/master moved during formula verification; rerun the job." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ywtc.rb
          if git diff --cached --quiet; then
            echo "Formula already current."
            exit 0
          fi
          git commit -m "chore(homebrew): update formula to v$RELEASE_VERSION"
          git push origin HEAD:master
