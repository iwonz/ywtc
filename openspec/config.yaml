schema: spec-driven

context: |
  Runtime: Node.js 24, npm 11.5.1 or newer, and strict TypeScript.
  Product: resumable, provider-neutral transfers between Yandex Wiki and Confluence plus Markdown/HTML exports.
  Authentication: Yandex OAuth or IAM; Confluence Data Center PAT or Cloud email/API token.
  Safety: dry-run support, no automatic destination deletion, atomic state, explicit degradation, secrets never logged.
  Testing: Vitest unit/contract/integration tests plus Playwright browser checks.

rules:
  proposal:
    - State explicit non-goals and destructive-operation boundaries.
  design:
    - Document retry, resume, conflict, and content-degradation behavior.
  specs:
    - Use SHALL/MUST requirements and Given/When/Then scenarios.
  tasks:
    - Include validation and documentation work.
